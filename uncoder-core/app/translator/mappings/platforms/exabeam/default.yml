platform: Exabeam
source: default

default_log_source:
  table: events

log_source:
  table: events

field_mapping:
  # Sigma standard field names to Exabeam CIM2
  CommandLine: process_command_line
  Image: process_path
  ParentImage: parent_process_path
  ParentCommandLine: parent_process_command_line
  ProcessId: process_id
  ParentProcessId: parent_process_id
  OriginalFileName: process_name
  User: user
  Computer: src_host
  EventID: event_code

  # Advanced process fields
  SourceImage: process_path
  TargetImage: process_path
  ImageLoaded: file_path
  ImagePath: process_path
  ProcessName: process_name
  IntegrityLevel: process_integrity

  # Event metadata
  Provider_Name: log_source
  EventType: activity_type
  Description: description
  
  # File event fields
  TargetFilename: file_path
  TargetFileName: file_path
  FileName: file_name
  FilePath: file_path
  
  # Registry fields
  TargetObject: registry_path
  Details: registry_details
  Data: registry_details
  RegistryKey: registry_key
  RegistryValue: registry_value
  
  # Network connection fields
  DestinationIp: dest_ip
  DestinationPort: dest_port
  SourceIp: src_ip
  SourcePort: src_port
  DestinationHostname: dest_host
  RemoteAddress: dest_ip
  RemotePort: dest_port
  

  # Service fields
  ServiceName: service_name
  
  # Authentication fields
  SubjectUserName: user
  TargetUserName: dest_user
  WorkstationName: src_host
  IpAddress: src_ip
  
  # Universal CIM2 fields
  time: time
  vendor: vendor
  product: product
  activity_type: activity_type
  outcome: outcome
  subject: user
  host: src_host
  
  # Process creation
  process.name: process_name
  process.pid: process_id
  process.command_line: process_command_line
  process.parent.name: parent_process_name
  process.parent.pid: parent_process_id
  process.parent.command_line: parent_process_command_line
  
  # User/Authentication
  user.name: user
  user.domain: domain
  source.user.name: user
  target.user.name: dest_user
  
  # Network
  source.ip: src_ip
  destination.ip: dest_ip
  source.port: src_port
  destination.port: dest_port
  network.protocol: protocol
  source.domain: src_host
  destination.domain: dest_host
  url.original: url
  
  # File
  file.name: file_name
  file.path: file_path
  file.directory: file_dir
  file.hash.md5: hash_md5
  file.hash.sha256: hash_sha256
  
  # Registry (Windows)
  registry.key: registry_key
  registry.value: registry_value
  registry.data: registry_details
  
  # Event ID mapping
  event.code: event_code
  event.action: activity
  
  # Service/System
  service.name: service_name
  winlog.channel: log_name
  winlog.event_id: event_code

  # DNS fields
  query: dns_query
  QueryName: dns_query
  QueryResults: dns_response
  QueryStatus: dns_response_code
  answer: dns_response
  record_type: dns_record_type

  # Authentication/Logon fields
  LogonType: logon_type
  LogonId: session_id
  TargetDomainName: dest_domain
  SubjectDomainName: domain

  # Advanced process fields (Sysmon)
  TerminalSessionId: session_id

  # File hash fields
  md5: hash_md5
  sha256: hash_sha256

  # Web/HTTP/URL fields
  URL: url
  url: url
  c-uri: url
  cs-method: method
  c-useragent: user_agent
  c-ip: src_ip
  UserAgent: user_agent
  User-Agent: user_agent
  cs-host: dest_host
  cs-referrer: referrer
  cs-referer: referrer
  sc-status: http_response_code

  # Cloud/AWS fields
  eventName: event_name
  eventSource: log_source
  awsRegion: region
  userIdentity.type: user_type
  userIdentity.principalId: principal_id
  userIdentity.arn: user_arn
  userIdentity.accountId: aws_account
  userIdentity.userName: user
  sourceIPAddress: src_ip
  userAgent: user_agent

  # Azure fields
  operationName: event_name
  resourceId: resource
  resourceType: resource_type
  subscriptionId: subscription_id
  tenantId: tenant_id
  caller: user

  # GCP fields
  protoPayload.methodName: event_name
  protoPayload.authenticationInfo.principalEmail: user
  protoPayload.resourceName: resource_name
  protoPayload.serviceName: service_name

  # Additional network fields
  Protocol: protocol
  DestinationHostname: dest_host
  SourceHostname: src_host
  Direction: direction
  BytesSent: bytes_out
  BytesReceived: bytes_in
  ShareName: share_name

  # Email fields
  Sender: email_address
  Recipient: dest_email_address
  Subject: email_subject

  # Object/Resource access fields
  ObjectType: object_type
  ObjectName: object_name
  HandleId: handle_id
  AccessMask: access
  GrantedAccess: access

  # Scheduled task fields
  TaskName: task_name

  # Windows event log fields
  Channel: log_name
  Level: severity

  # Host/Device fields
  Hostname: src_host
  HostName: src_host
  ComputerName: src_host
  host.name: src_host
  host.hostname: src_host

  # Application-specific fields
  Application: process_path