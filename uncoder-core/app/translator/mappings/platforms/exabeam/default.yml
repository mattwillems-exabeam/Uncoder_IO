platform: Exabeam
source: default

default_log_source:
  table: events

log_source:
  table: events

field_mapping:
  # Sigma standard field names to Exabeam CIM2
  CommandLine: process_command_line
  Image: process_path
  ParentImage: parent_process_path
  ParentCommandLine: parent_process_command_line
  ProcessId: process_id
  ParentProcessId: parent_process_id
  OriginalFileName: process_name
  User: user
  Computer: src_host
  EventID: event_id
  
  # File event fields
  TargetFilename: file_path
  TargetFileName: file_path
  FileName: file_name
  FilePath: file_path
  
  # Registry fields  
  TargetObject: registry_path
  Details: registry_value_data
  RegistryKey: registry_key
  RegistryValue: registry_value_name
  
  # Network connection fields
  DestinationIp: dest_ip
  DestinationPort: dest_port
  SourceIp: src_ip
  SourcePort: src_port
  Initiated: network_initiated
  DestinationHostname: dest_host
  RemoteAddress: dest_ip
  RemotePort: dest_port
  
  # PowerShell fields
  ScriptBlockText: powershell_script_content
  
  # Additional process fields
  Company: process_company
  Product: process_product
  FileDescription: process_description
  ProductVersion: process_product_version
  
  # Service fields
  ServiceName: service_name
  ServiceFileName: service_path
  
  # Authentication fields
  SubjectUserName: user
  TargetUserName: dest_user
  WorkstationName: src_host
  IpAddress: src_ip
  
  # Universal CIM2 fields
  time: timestamp
  vendor: vendor
  product: product
  activity_type: activity_type
  outcome: outcome
  subject: user
  host: src_host
  
  # Process creation
  process.name: process_name
  process.pid: process_id
  process.command_line: process_command_line
  process.parent.name: parent_process_name
  process.parent.pid: parent_process_id
  process.parent.command_line: parent_process_command_line
  
  # User/Authentication  
  user.name: user
  user.domain: user_domain
  source.user.name: src_user
  target.user.name: dest_user
  
  # Network
  source.ip: src_ip
  destination.ip: dest_ip
  source.port: src_port
  destination.port: dest_port
  network.protocol: protocol
  source.domain: src_host
  destination.domain: dest_host
  url.original: url
  
  # File
  file.name: file_name
  file.path: file_path
  file.directory: file_directory
  file.hash.md5: file_hash
  file.hash.sha1: file_hash
  file.hash.sha256: file_hash
  file.hash.sha512: file_hash
  
  # Registry (Windows)
  registry.key: registry_key
  registry.value: registry_value_name
  registry.data: registry_value_data
  
  # Event ID mapping
  event.code: event_id
  event.action: activity
  
  # Service/System
  service.name: service_name
  winlog.channel: log_name
  winlog.event_id: event_id

  # DNS fields
  query: dns_query
  QueryName: dns_query
  QueryResults: dns_response
  QueryStatus: dns_response_code
  answer: dns_response
  record_type: dns_record_type
  parent_domain: dns_parent_domain

  # Authentication/Logon fields
  LogonType: logon_type
  LogonId: logon_id
  LogonGuid: logon_guid
  AuthenticationPackageName: auth_package
  TargetLogonId: target_logon_id
  TargetDomainName: dest_user_domain
  SubjectDomainName: user_domain
  FailureReason: failure_reason
  Status: status
  SubStatus: sub_status

  # Advanced process fields (Sysmon)
  IntegrityLevel: process_integrity_level
  CurrentDirectory: process_working_directory
  TerminalSessionId: terminal_session_id
  ProcessGuid: process_guid
  ParentProcessGuid: parent_process_guid
  UtcTime: timestamp
  CreationUtcTime: timestamp
  ParentUser: parent_process_user

  # Code signing fields
  Signed: process_signed
  Signature: process_signature
  SignatureStatus: process_signature_status

  # File hash fields
  Hashes: file_hash
  md5: file_hash
  sha1: file_hash
  sha256: file_hash
  sha512: file_hash
  IMPHASH: process_imphash
  Imphash: process_imphash

  # Web/HTTP/URL fields
  URL: url
  url: url
  cs-uri-query: url_query
  cs-uri-stem: url_path
  cs-method: http_method
  c-useragent: user_agent
  UserAgent: user_agent
  User-Agent: user_agent
  cs-host: dest_host
  cs-referrer: http_referrer
  sc-status: http_status

  # Cloud/AWS fields
  eventName: event_name
  eventSource: event_source
  awsRegion: cloud_region
  userIdentity.type: user_type
  userIdentity.principalId: principal_id
  userIdentity.arn: user_arn
  userIdentity.accountId: account_id
  userIdentity.userName: user
  sourceIPAddress: src_ip
  userAgent: user_agent
  requestParameters: request_parameters
  responseElements: response_elements

  # Azure fields
  operationName: event_name
  resourceId: resource_id
  resourceType: resource_type
  subscriptionId: subscription_id
  tenantId: tenant_id
  caller: user

  # GCP fields
  protoPayload.methodName: event_name
  protoPayload.authenticationInfo.principalEmail: user
  protoPayload.resourceName: resource_name
  protoPayload.serviceName: service_name

  # Additional network fields
  Protocol: protocol
  DestinationHostname: dest_host
  SourceHostname: src_host
  Direction: direction
  BytesSent: bytes_sent
  BytesReceived: bytes_received

  # Email fields
  Sender: sender
  Recipient: recipient
  Subject: email_subject

  # Object/Resource access fields
  ObjectType: object_type
  ObjectName: object_name
  ObjectServer: object_server
  AccessMask: access_mask
  HandleId: handle_id

  # Advanced threat fields
  GrantedAccess: granted_access
  CallTrace: call_trace
  SourceImage: source_process_path
  TargetImage: target_process_path

  # Windows event log fields
  Channel: log_name
  Provider_Name: provider_name
  EventRecordID: event_record_id
  Level: severity
  Task: task
  Keywords: keywords

  # Application-specific fields
  Application: process_path
  FilterOrigin: filter_origin
  Initiated: initiated
  RuleName: rule_name

  # Host/Device fields
  Hostname: src_host
  HostName: src_host
  ComputerName: src_host
  host.name: src_host
  host.hostname: src_host
  host.id: host_id