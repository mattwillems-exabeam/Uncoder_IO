title: Mimikatz Process Detection
id: test-mimikatz-001
status: test
description: Detects execution of Mimikatz credential dumping tool
author: Test Author
date: 2024/01/01
level: critical
logsource:
    product: windows
    service: sysmon
    definition: 'Sysmon EID 1'
detection:
    selection:
        EventID: 1
        Image|contains: 'mimikatz'
        CommandLine|contains:
            - 'sekurlsa'
            - 'lsadump'
    condition: selection
falsepositives:
    - Security testing
    - Penetration testing
tags:
    - attack.credential_access
    - attack.t1003.001
