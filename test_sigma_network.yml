title: Suspicious Outbound Connection
id: test-network-001
status: test
description: Detects outbound connections to suspicious IPs on common backdoor port
author: Test Author
date: 2024/01/01
level: medium
logsource:
    category: firewall
detection:
    selection:
        DestinationIp:
            - '192.168.1.100'
            - '10.0.0.50'
        DestinationPort: 4444
    condition: selection
falsepositives:
    - Internal application traffic
tags:
    - attack.command_and_control
    - attack.t1071.001
